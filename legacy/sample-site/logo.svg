<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C0C0C0"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>
  <symbol id="logo-mark" viewBox="0 0 32 32">
    <!-- Elegant D monogram with African pattern accent -->
    <circle cx="16" cy="16" r="14" stroke="url(#logoGrad)" stroke-width="2" fill="none"/>
    <path d="M16 6C10.5 6 6 10.5 6 16S10.5 26 16 26" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M10 16H22" stroke="url(#logoGrad)" stroke-width="2" stroke-linecap="round"/>
    <!-- Subtle pattern dots -->
    <g fill="url(#logoGrad)" opacity="0.6">
      <circle cx="16" cy="10" r="1.2"/>
      <circle cx="16" cy="22" r="1.2"/>
      <circle cx="10" cy="16" r="1.2"/>
      <circle cx="22" cy="16" r="1.2"/>
    </g>
  </symbol>
  <!-- For direct use as favicon -->
  <use href="#logo-mark"/>
</svg>
