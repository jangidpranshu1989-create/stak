<!doctype html>
<html lang="{{LANG}}" data-theme="{{MODE}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="config.js"></script>
<script src="icons.js"></script>
<script src="kit.js"></script>
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Conversations">
    <div class="side-top">
      <div class="brand"><span class="brand-mark" id="brandMark"></span><span class="brand-name" id="brandName"></span></div>
      <button class="icon-btn side-close" id="sideClose" aria-label="Close sidebar"></button>
    </div>
    <button class="btn btn-secondary new-chat" id="newChat" type="button"><span data-icon="plus" data-size="16"></span><span>New chat</span><span class="kbd">Ctrl K</span></button>
    <label class="side-search"><span data-icon="search" data-size="15"></span><input id="convSearch" type="search" placeholder="Search chats" autocomplete="off" aria-label="Search chats"></label>
    <nav class="conv-list" id="convList"></nav>
    <div class="side-foot">
      <button class="side-link" id="themeBtn" type="button"></button>
      <button class="side-link" id="clearAll" type="button"><span data-icon="trash" data-size="16"></span><span>Clear all chats</span></button>
    </div>
  </aside>
  <div class="overlay side-ov" id="sideOv"></div>

  <main class="main">
    <header class="top">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Open chats"></button>
      <div class="top-title"><h1 id="chatTitle">New chat</h1><span class="status" id="status"><span class="dot"></span><span id="statusText">Online</span></span></div>
      <button class="icon-btn" id="newChatTop" aria-label="New chat"></button>
    </header>

    <section class="thread" id="thread" aria-live="polite">
      <div class="welcome" id="welcome">
        <div class="welcome-mark" id="welcomeMark"></div>
        <h2 id="greeting"></h2>
        <p id="tagline"></p>
        <div class="suggest" id="suggest"></div>
      </div>
      <div class="msgs" id="msgs"></div>
    </section>

    <form class="composer" id="composer" autocomplete="off">
      <div class="composer-box">
        <textarea id="input" rows="1" placeholder="Message…" aria-label="Message" maxlength="8000"></textarea>
        <button class="send" id="send" type="submit" aria-label="Send message" disabled></button>
      </div>
      <p class="disclaimer" id="disclaimer"></p>
    </form>
  </main>
</div>
<script src="app.js" defer></script>
</body>
</html>
